<text x="20" y="56" fill="#f0c674" font-weight="bold">### Q3: 我的 PyTorch 跟 CUDA 版本相容嗎？</text>
<text x="20" y="78" fill="#707880">&gt; build · gpt-oss-32k</text>
<text x="20" y="100" fill="#81a2be" font-weight="bold">⚙ gpu-env-butler_cuda_stack Unknown</text>
<text x="20" y="122" fill="#e6e6e6">目前 Python 環境中尚未安裝 torch，因此無法直接驗證 PyTorch 與 CUDA 的相容性。</text>
<text x="20" y="144" fill="#e6e6e6">- 驅動版本：**13.3**（上限 13.3）</text>
<text x="20" y="166" fill="#e6e6e6">- 若安裝 PyTorch，請選擇可支援 CUDA 13.3 的版本（例如 cu12x 或 cu13x 版）。</text>
<text x="20" y="188" fill="#e6e6e6">- 如需進一步檢查安裝結果，請安裝 `torch` 後再查詢。</text>
</g></svg>